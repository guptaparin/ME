<title>Parin's Workbench</title>
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D night workbench; HUD floats in the corners; a side sheet (bottom sheet on phones) opens for each object. Single deliberate dark look: the bench is lit by one lamp. */
:root{
  --night:#0B0D0C; --sheet:#151816; --paper:#EFE8DA; --dim:#A49D8E; --line:#2B302D;
  --amber:#FFB54A; --phosphor:#7CF5B2; --copper:#D9844A;
  --display:"Anybody", "Arial Narrow", system-ui, sans-serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#stage.drag{cursor:grabbing}
#stage.hot{cursor:pointer}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud *{pointer-events:auto}
.hud.tl{text-shadow:0 2px 14px rgba(0,0,0,.75)}
.hud.tl{top:calc(18px + env(safe-area-inset-top,0px));left:max(18px, env(safe-area-inset-left,0px))}
.hud.tr{top:calc(18px + env(safe-area-inset-top,0px));right:max(18px, env(safe-area-inset-right,0px));display:flex;gap:10px}
.hud.bc{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;padding-inline:max(16px, env(safe-area-inset-left,0px))}
h1{margin:0;font-family:var(--display);font-weight:800;font-stretch:72%;font-size:clamp(30px,4.4vw,56px);line-height:.95;letter-spacing:-0.01em}
.count{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:8px;display:flex;gap:10px;align-items:center}
.count b{color:var(--phosphor);font-weight:500}
.meter{width:110px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--phosphor);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pillbtn{font:500 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:rgba(21,24,22,.72);
  border:1px solid #3A403C;border-radius:999px;padding:11px 18px;cursor:pointer;backdrop-filter:blur(6px)}
.pillbtn:hover{border-color:var(--amber);color:var(--amber)}
.pillbtn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.hint{font-size:15px;color:var(--dim);display:inline-block;background:rgba(11,13,12,.55);padding:6px 12px;border-radius:8px}
#tip{position:fixed;z-index:6;pointer-events:none;font:500 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  background:var(--paper);color:var(--night);padding:6px 10px;border-radius:6px;transform:translate(14px,14px);opacity:0;transition:opacity .15s}

/* sheet */
.sheet{position:fixed;z-index:8;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--sheet);border-left:1px solid var(--line);
  transform:translateX(104%);transition:transform .55s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sheet .kind{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.close{background:none;border:1px solid var(--line);color:var(--paper);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.close:hover{border-color:var(--amber)}
.sheet .body{overflow-y:auto;padding:24px 22px 40px;display:flex;flex-direction:column;gap:20px;min-height:0}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-stretch:80%;font-size:clamp(40px,7vw,64px);line-height:.92;letter-spacing:-0.01em;text-wrap:balance}
.sheet p{margin:0;line-height:1.6;color:#D7D0C2;max-width:60ch}
.status{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 12px;width:fit-content}
.status i{width:8px;height:8px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 8px var(--phosphor)}
.status.wip i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.status.ask i{background:var(--copper);box-shadow:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:400 12.5px var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--dim)}
.facts{display:grid;gap:0;margin:0}
.facts div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.facts dt{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.facts dd{margin:0}
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:600 15px var(--body);border-radius:999px;padding:11px 18px;border:1px solid var(--paper);background:var(--paper);color:var(--night);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--paper)}
.btn:hover{background:var(--amber);border-color:var(--amber);color:var(--night)}
.eyebrowish{font:500 12px var(--mono)!important;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)!important;margin-top:6px!important}
.film{display:grid;gap:8px}
.film video{width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;display:block}
.film h3{margin:4px 0 0;font-family:var(--display);font-weight:700;font-stretch:85%;font-size:28px}
.film .mono{font:400 12.5px var(--mono);color:var(--dim);letter-spacing:.06em}
.email{font-family:var(--display);font-weight:700;font-stretch:90%;font-size:clamp(22px,4vw,30px);user-select:all;word-break:break-all}

/* menu */
.menu{position:fixed;z-index:9;inset:0;background:rgba(11,13,12,.94);backdrop-filter:blur(8px);display:none;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) 40px max(20px, env(safe-area-inset-left,0px))}
.menu.open{display:block}
.menu-in{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.menu-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.group h3{margin:0 0 8px;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.group button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;box-sizing:border-box;padding:10px 0;border-bottom:1px solid var(--line);
  font-family:var(--display);font-weight:700;font-stretch:85%;font-size:28px}
.group button:hover{color:var(--amber)}
.group button:focus-visible{outline:2px solid var(--amber)}
.group button small{font:400 12px var(--mono);color:var(--dim);letter-spacing:.08em}
.group button.found small{color:var(--phosphor)}

.boot{position:fixed;inset:0;z-index:20;background:var(--night);display:grid;place-items:center;transition:opacity .6s}
.boot.gone{opacity:0;pointer-events:none}
.boot span{font:500 13px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--phosphor)}
.fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
@media (max-width:640px){
  .sheet{top:auto;left:0;width:100%;height:78%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(104%);padding-left:env(safe-area-inset-left,0px)}
  .hud.tr{flex-direction:column;align-items:flex-end}
  .pillbtn{padding:9px 14px}
  .hint{font-size:13.5px}
}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}.meter i{transition:none}}
</style>

</head><body>
<canvas id="stage" tabindex="0" aria-label="3D workbench. Use the Menu button for a list of everything on the bench."></canvas>
<div class="hud tl">
  <h1>Parin's<br>workbench</h1>
  <div class="count" style="margin-top:6px;letter-spacing:.08em">AI engineer · builder · motion</div>
  <div class="count"><span><b id="foundN">0</b> of <span id="totalN">15</span> found</span><span class="meter" aria-hidden="true"><i id="meterBar"></i></span></div>
</div>
<div class="hud tr">
  <button class="pillbtn" id="hintBtn" type="button">Hints</button>
  <button class="pillbtn" id="menuBtn" type="button">Menu</button>
</div>
<div class="hud bc"><span class="hint" id="hintLine">Drag to look around. Tap anything on the bench.</span></div>
<div id="tip"></div>

<aside class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle">
  <header><span class="kind" id="sheetKind"></span><button class="close" id="closeBtn" type="button" aria-label="Close">✕</button></header>
  <div class="body" id="sheetBody"></div>
</aside>

<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Everything on the bench">
  <div class="menu-in">
    <div class="menu-top"><span class="count" style="margin:0">The quick way through</span><button class="close" id="menuClose" type="button" aria-label="Close menu">✕</button></div>
    <div class="groups" id="groups"></div>
  </div>
</div>
<div class="boot" id="boot"><span>Powering up the bench</span></div>
<div class="fallback" id="fallback"><p>This browser can't draw the 3D bench. Open the Menu to see everything.</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const ASSET={resume:"assets/Parin_Gupta_Resume.pdf",ondo:"assets/ondo.mp4",ondoPoster:"assets/ondo-poster.jpg",tl:"assets/tastelaunch.mp4",tlPoster:"assets/tastelaunch-poster.jpg",du:"assets/duely.mp4",duPoster:"assets/duely-poster.jpg"};
const EMAIL="paringupta17@gmail.com";

// ---------- content ----------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link=(href,label,ghost)=>`<a class="btn${ghost?' ghost':''}" href="${href}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;
const status=(t,cls)=>`<span class="status ${cls||''}"><i></i>${esc(t)}</span>`;
const tags=a=>`<div class="tags">${a.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
const facts=rows=>`<dl class="facts">${rows.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
function app(o){return{kind:o.kind||'App · on the breadboard',group:'Apps',title:o.title,label:o.title,
  html:`<h2 id="sheetTitle">${esc(o.title)}</h2>${status(o.status,o.sc)}<p>${o.text}</p>${tags(o.stack)}${o.facts?facts(o.facts):''}<div class="links">${(o.links||[]).map((l,i)=>link(l[0],l[1],i>0)).join('')}</div>`}}
const ITEMS={
 scope:{kind:'Motion · the oscilloscope',group:'Motion',title:'Motion films',label:'Motion films',html:`
  <h2 id="sheetTitle">Motion films</h2>
  <p>Launch films for products, timed to music and built around one idea each. The scope on the bench is playing the first one.</p>
  <div class="film"><video src="${ASSET.ondo}" poster="${ASSET.ondoPoster}" controls playsinline preload="none"></video><h3>ondo</h3><span class="mono">Concept product film · 0:30 · 1080p60 · 120 BPM</span><p>A launch film for ondo, a fictional music app. One coral disc carries every transition: logo, play button, mood picker, the drop, a shared session, an EQ handle, and finally the "o" in the wordmark.</p></div>
  <div class="film"><video src="${ASSET.tl}" poster="${ASSET.tlPoster}" controls playsinline preload="none"></video><h3>TasteLaunch</h3><span class="mono">Launch film · 0:24 · Qloo hackathon 2026</span><p>From one typed idea to a named café with its own palette and storefront, then a side-by-side showing how much better the picks get with Qloo's taste data.</p></div>
  <div class="film"><video src="${ASSET.du}" poster="${ASSET.duPoster}" controls playsinline preload="none"></video><h3>Duely</h3><span class="mono">Promo film · 0:30 · Galuxium Nexus V2 2026</span><p>Opens on the late-payment problem and follows one invoice from drafting through friendly, firm and final reminders to a one-link payment.</p></div>`},
 c_studylix:app({title:'Studylix',status:'Live · testing',text:'A study operating system that puts timetable, tasks, exams, a focus timer and notes in one place, with each subject linking everything together. It has two-way Google Calendar sync, background jobs, file storage, and separate dev and prod databases.',stack:['Next.js','TypeScript','PostgreSQL','Inngest','Google OAuth','Backblaze B2'],links:[['https://studylix.vercel.app','Open Studylix']]}),
 c_campus:app({title:'CampusLoop',status:'Demo on request',sc:'ask',text:'A mini-metro network for college campuses. Shuttles run on fixed, scheduled loops you can watch live; enter your hostel block and your 8:50 class and it picks the exact slot to catch; book a seat the night before and board with a digital pass. Fleet control handles delays and route changes live.',stack:['Next.js','Tailwind CSS','Leaflet.js'],links:[['https://www.linkedin.com/in/guptaparin/','Ask for a demo']]}),
 c_duely:app({title:'Duely',status:'Live',text:'Describe the work in one sentence and Duely turns it into a proper GST invoice with its own payment link. Clients pay by UPI, card or net banking through Razorpay. If they don\'t, the AI writes the follow-up, getting firmer the later the payment is: friendly, then firm, then final.',stack:['Next.js','Supabase (row-level security)','Razorpay orders + webhooks','Groq'],facts:[['Payments','Signature verification and webhooks, so an invoice is marked paid exactly once'],['AI','Every drafted output is schema-checked'],['Event','Galuxium Nexus V2 · solo entry'],['Film','Launch film directed and produced by me']],links:[['https://duely-one.vercel.app','Open Duely']]}),
 c_taste:app({title:'TasteLaunch',status:'Live',text:'An AI co-founder that designs a local business around what people nearby actually like, grounded in Qloo\'s taste graph.',stack:['Agentic AI','Qloo API','Next.js'],facts:[['Event','Qloo hackathon 2026']],links:[['https://tastelaunch.vercel.app','Open TasteLaunch']]}),
 c_attend:app({title:'AttendGuard',status:'Live',text:'Tells you whether you can skip the next class or need to show up, based on your attendance and your college\'s minimum.',stack:['JavaScript','GitHub Pages'],facts:[['Event','Build With AI: Basics (Devpost)']],links:[['https://guptaparin.github.io/attendguard','Open AttendGuard'],['https://github.com/guptaparin/attendguard','Code']]}),
 c_pactly:app({title:'Pactly',status:'In progress',sc:'wip',text:'An agent that turns a deal made over chat into structured terms, holds the money with PayPal authorize and capture, and releases it only after both sides confirm delivery.',stack:['AI agents','PayPal Orders API'],facts:[['Event','PayPal AI Hackathon · solo']],links:[['https://github.com/guptaparin/pactly','Code']]}),
 c_volt:app({title:'VoltProof',status:'In progress',sc:'wip',text:'Hourly certificates for solar energy, so a kilowatt-hour can be traced to the hour it was generated.',stack:['Blockchain','Energy data'],facts:[['Event','IEEE ClimateChain Global Hackathon 2026 · solo']],links:[['https://github.com/guptaparin/voltproof','Code']]}),
c_rtos:app({title:'RTStudio',status:'Live',text:'An interactive real-time scheduler simulator that shows how a car or a medical device decides what runs next. It runs preemptive Rate-Monotonic and Earliest-Deadline-First scheduling, draws the result as a Gantt chart, and simulates priority inversion with mutexes, the Priority Inheritance Protocol and interrupt-driven preemption.',stack:['JavaScript','Operating systems','RTOS scheduling'],facts:[['Full name','Computer Traffic Controller']],links:[['https://computer-traffic-controller.vercel.app/','Open RTStudio'],['https://github.com/guptaparin/Computer-Traffic-Controller','Code']]}),
c_aegis:app({title:'Aegis',status:'Built',text:'A Layer 7 web application firewall and reverse proxy built from scratch on Python\'s raw sockets, with no Flask, Express or HTTP library. It parses raw HTTP bytes by hand, checks requests for injection in context, and when it catches an attack such as XSS it cuts the connection and answers 403 before the backend ever sees it.',stack:['Python sockets','HTTP parsing','Web security']}),
 c_flow:app({title:'FlowDesk',status:'In progress',sc:'wip',text:'A private academic dashboard. You create your own subjects, each with files, to-dos and notes, and everything rolls up into one calendar and one to-do list.',stack:['Next.js','Tailwind','Framer Motion']}),
 fpga:{kind:'Hardware · the FPGA board',group:'Experience',title:'FPGA internship',label:'FPGA internship',html:`
  <h2 id="sheetTitle">FPGA internship</h2>${status('5G Use Case Lab · BITS Pilani','ask')}
  <p>Summer research intern under Prof. Sandeep Joshi, EEE Department, June to July 2026. My project was FPGA prototyping using Verilog HDL. I designed and simulated combinational and sequential logic in Verilog and deployed it to an FPGA with Xilinx Vivado.</p>
  ${facts([['Role','Hardware Engineering Intern'],['When','June – July 2026 · Pilani'],['Tested','D flip-flops and adders against 50+ test vectors, confirming synchronous reset'],['Wired','XDC constraint files mapping logic I/O to the board\'s switches and LEDs'],['Tools','Verilog HDL, Xilinx Vivado']])}
  <p>The LEDs on this board are counting in binary, the same way mine did in the lab.</p>`},
 notebook:{kind:'About · the sketchbook',group:'About',title:'About me',label:'About me',html:`
  <h2 id="sheetTitle">AI engineer in the making.</h2>
  <p>I build agentic, LLM-powered products and ship them end to end.</p>
  <p>I'm a second-year Computer Engineering student at Thapar Institute of Engineering &amp; Technology (CGPA 9.72), working at the intersection of applied AI, full-stack software, and the hardware it runs on.</p>
  <p class="eyebrowish">What I'm building right now</p>
  ${facts([['Open source','Contributor to huggingface_hub. My fix for a missing top-level export (PR #5140) was merged into main, and I\'m working through more issues, including a fix in the MCP client.'],
    ['Duely','An AI invoice chaser for freelancers and agencies that automates payment follow-ups, with Razorpay payments built in. Live on Vercel.'],
    ['Pactly','An AI escrow agent that turns informal chat deals into secure payments using PayPal\'s authorize/capture flow.'],
    ['Studylix','A study operating system that brings timetables, tasks, exams, a focus timer and notes into one app, with two-way Google Calendar sync. Built with Next.js, TypeScript and Postgres, and onboarding its first users now.'],
    ['CampusLoop','A fixed-schedule campus e-rickshaw transit system with live tracking, a class-commute matcher, QR boarding passes and a driver/admin panel.']])}
  ${facts([['Studying','B.E. Computer Engineering, TIET · 2025 – 2029 · CGPA 9.72'],['Campus','Internshala Student Partner, TIET · Fall 2026 cohort'],['Also','I direct and produce the launch films for my products']])}
  <p>Reach out here, or find my code on GitHub.</p>
  <div class="links">${link('https://github.com/guptaparin','github.com/guptaparin')}${link('https://www.linkedin.com/in/guptaparin/','LinkedIn',true)}</div>`},
 meter:{kind:'Skills · the multimeter',group:'About',title:'Skills',label:'Skills',html:`
  <h2 id="sheetTitle">What I measure up to</h2>
  ${facts([['Motion','Product films, UI animation, kinetic type, logo animation, cutting to music'],['Languages','Python, C++, C, TypeScript, JavaScript, SQL, Verilog HDL'],['AI','LLM APIs, AI agents, Model Context Protocol, Hugging Face, Amazon Bedrock'],['Web','Next.js, React, Node.js, REST APIs, PostgreSQL, Tailwind CSS, OAuth'],['Tools','Git, Vercel, Neon, Inngest, Linux, Xilinx Vivado'],['Certified','Google AI Professional Certificate (7 courses, Jun 2026) · Amazon Bedrock Customization, Optimization & Automation, AWS (Jul 2026) · AWS Generative AI and AI Agents with Amazon Bedrock']])}`},
 clipboard:{kind:'Resume · the clipboard',group:'About',title:'Resume',label:'Resume',html:`
  <h2 id="sheetTitle">Resume</h2>
  ${facts([['Now','Open source contributor, huggingface_hub · Oct 2026 – present'],['Before','Hardware Engineering Intern, BITS Pilani 5G Systems Lab · Jun – Jul 2026'],['Built','Duely, Pactly, Studylix, RTStudio, CampusLoop, Aegis'],['Studying','B.E. Computer Engineering, Thapar Institute · 2025 – 2029']])}
  <div class="links" id="resumeLinks"><button class="btn" id="dlResume" type="button">Download resume (PDF)</button>${link(ASSET.resume,'Open in a new tab',true)}</div>
  <p id="resumeMsg" class="mono" style="color:var(--dim);font-size:13px"></p>`},
 oss:{kind:'Open source · the laptop',group:'Experience',title:'Hugging Face',label:'Open source',html:`
  <h2 id="sheetTitle">Open source at Hugging Face</h2>${status('Oct 2026 – present')}
  <p>I contribute bug fixes and API improvements to huggingface_hub, Hugging Face's official Python client for models, datasets and Spaces on the Hub.</p>
  ${facts([['Work','Fixes across public API exports and the MCPClient (Model Context Protocol) module'],['Merged','PR #5140: a fix for a missing top-level export, merged into main'],['Next','More issues in progress, including a fix in the MCP client'],['Process','Reproduce the bug, write the fix and tests, pass maintainer review and CI']])}
  <div class="links">${link('https://github.com/huggingface/huggingface_hub/pull/5140','PR #5140')}${link('https://github.com/huggingface/huggingface_hub','huggingface_hub',true)}${link('https://github.com/guptaparin','My GitHub',true)}</div>`},
 radio:{kind:'Contact · the radio',group:'Contact',title:'Contact',label:'Contact',html:`
  <h2 id="sheetTitle">Send a signal</h2>
  <p>Hiring a motion design or software intern, or want a launch film for your product? Write to me.</p>
  <span class="email" id="emailTxt">${EMAIL}</span>

// ---------- camera control ----------
const target=new THREE.Vector3(0,.9,0.2),home={yaw:0,pitch:.62,r:19};
const cam={yaw:home.yaw,pitch:home.pitch,r:home.r,t:target.clone()};
const goal={yaw:cam.yaw,pitch:cam.pitch,r:cam.r,t:target.clone()};
const FOCUS={scope:{t:[-3.9,1.9,-1.6],r:8.5,yaw:.15,pitch:.22},fpga:{t:[4.9,.6,-1.5],r:7,yaw:-.25,pitch:.75},lamp:{t:[4.5,3,-2.5],r:13,yaw:-.2,pitch:.35},
  notebook:{t:[-6.3,.5,1.7],r:6.5,yaw:.2,pitch:.95},clipboard:{t:[-2.9,.5,2.8],r:6,yaw:0,pitch:1.0},meter:{t:[4.6,.6,2.4],r:6,yaw:-.2,pitch:.85},oss:{t:[-7.4,1.1,-1.8],r:7,yaw:.95,pitch:.4},radio:{t:[7.2,1.4,1.2],r:7.5,yaw:-.45,pitch:.4}};
function focusOn(id){
  if(!id){goal.yaw=home.yaw;goal.pitch=home.pitch;goal.r=home.r;goal.t.copy(target);return}
  let f=FOCUS[id];
  if(!f&&groups[id]){const p=groups[id].position;f={t:[p.x,p.y+.3,p.z],r:5.5,yaw:0,pitch:.9}}
  if(!f)return;
  const narrow=innerWidth<640, side=!narrow;
  goal.t.set(...f.t);goal.r=f.r*(narrow?1.35:1);goal.yaw=f.yaw;goal.pitch=f.pitch;
  if(side){ // shift so the object sits left of the sheet
    const shift=Math.min(520,innerWidth)/innerWidth*f.r*.42;goal.t.x+=Math.cos(goal.yaw)*shift;goal.t.z-=Math.sin(goal.yaw)*shift}
  else{goal.t.y-=f.r*.18}
}
let dragging=false,moved=0,last=null,pinch=null;const pointers=new Map();
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=true;moved=0;last={x:e.clientX,y:e.clientY};
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
canvas.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&pinch){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);goal.r=clampR(goal.r*pinch/d);pinch=d;moved+=10;return}
  if(dragging&&last){const dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);
    goal.yaw=Math.max(-.85,Math.min(.85,goal.yaw-dx*.005));goal.pitch=Math.max(.12,Math.min(1.25,goal.pitch+dy*.004));last={x:e.clientX,y:e.clientY};canvas.classList.toggle('drag',moved>4)}
  hover(e.clientX,e.clientY)});
function endPtr(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;
  if(dragging&&moved<6&&e.type==='pointerup'){const id=pick(e.clientX,e.clientY);if(id)openItem(id);else if(openId)closeSheet()}
  if(pointers.size===0){dragging=false;canvas.classList.remove('drag')}}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('pointerleave',()=>{tip.style.opacity=0;setHot(null)});
const clampR=r=>Math.max(5,Math.min(26,r));
canvas.addEventListener('wheel',e=>{e.preventDefault();goal.r=clampR(goal.r*(1+Math.sign(e.deltaY)*.08))},{passive:false});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(x,y){const r=canvas.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(clickables,false)[0];return h?h.object.userData.id:null}
const tip=document.getElementById('tip');let hotId=null;
function setHot(id){if(hotId===id)return;hotId=id;canvas.classList.toggle('hot',!!id)}
function hover(x,y){if(dragging&&moved>4){tip.style.opacity=0;return}const id=pick(x,y);setHot(id);
  if(id){tip.textContent=(found.has(id)?'✓ ':'')+(ITEMS[id].group==='Hidden'&&!found.has(id)?'Hmm?':ITEMS[id].label);tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1}else tip.style.opacity=0}
// keyboard: arrows orbit, +/- zoom
canvas.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft')goal.yaw=Math.max(-.85,goal.yaw+.1);if(k==='ArrowRight')goal.yaw=Math.min(.85,goal.yaw-.1);
  if(k==='ArrowUp')goal.pitch=Math.min(1.25,goal.pitch+.08);if(k==='ArrowDown')goal.pitch=Math.max(.12,goal.pitch-.08);if(k==='+'||k==='=')goal.r=clampR(goal.r*.92);if(k==='-')goal.r=clampR(goal.r*1.08)});

// hints: pulse what hasn't been found
let hintUntil=0;document.getElementById('hintBtn').onclick=()=>{hintUntil=performance.now()+3500;const left=ORDER.filter(id=>!found.has(id)).length;
  document.getElementById('hintLine').textContent=left?`${left} left. The glowing things are the ones you haven't opened yet.`:'You found everything.';};
const glowMats=new Map();
Object.entries(groups).forEach(([id,g])=>{const mats=[];g.traverse(o=>{if(o.isMesh){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.isMeshStandardMaterial&&!mats.includes(m))mats.push(m)})}});glowMats.set(id,mats)});
// materials are shared across objects (knobs etc.), so clone per group to glow independently
glowMats.forEach((mats,id)=>{const map=new Map();groups[id].traverse(o=>{if(!o.isMesh)return;const arr=Array.isArray(o.material)?o.material:[o.material];
  const out=arr.map(m=>{if(!m.isMeshStandardMaterial)return m;if(!map.has(m))map.set(m,m.clone());return map.get(m)});o.material=Array.isArray(o.material)?out:out[0]});glowMats.set(id,[...map.values()])});

// ---------- loop ----------
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<640?50:38;home.r=w<640?31:(w/h<1.2?24:19);camera.updateProjectionMatrix()}
addEventListener('resize',()=>{resize();if(!openId){goal.r=home.r}});resize();cam.r=goal.r=home.r;
const clock=new THREE.Clock();let frame=0;
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,k=1-Math.pow(.0015,dt);
  cam.yaw+=(goal.yaw-cam.yaw)*k;cam.pitch+=(goal.pitch-cam.pitch)*k;cam.r+=(goal.r-cam.r)*k;cam.t.lerp(goal.t,k);
  const idle=reduce||dragging||openId?0:Math.sin(t*.25)*.03;
  const y=cam.yaw+idle;camera.position.set(cam.t.x+cam.r*Math.sin(y)*Math.cos(cam.pitch),cam.t.y+cam.r*Math.sin(cam.pitch),cam.t.z+cam.r*Math.cos(y)*Math.cos(cam.pitch));camera.lookAt(cam.t);
  // FPGA binary counter
  const n=Math.floor(t*(reduce?1:4))%256;leds.forEach((m,i)=>m.color.set((n>>(7-i))&1?0xFF4A2E:0x330a06));
  tipM.color.set(Math.sin(t*3)>.6?0xFF4A2E:0x400c06);
  if(!reduce)dial.rotation.y=Math.sin(t*.7)*.6;
  // glow: hover + hints
  const hinting=performance.now()<hintUntil;
  glowMats.forEach((mats,id)=>{let e=0;if(id===hotId)e=.35;else if(hinting&&!found.has(id))e=.25+.25*Math.sin(t*6);
    mats.forEach(m=>{m.emissive.setRGB(e,e*.75,e*.4)})});
  renderer.render(scene,camera);
  if(++frame===2)document.getElementById('boot').classList.add('gone');
  requestAnimationFrame(loop);
}
const vp=video.play();if(vp&&vp.catch)vp.catch(()=>{});
document.addEventListener('pointerdown',()=>{if(video.paused){const p=video.play();if(p&&p.catch)p.catch(()=>{})}},{once:true});
requestAnimationFrame(loop);
window.__bench={openItem,closeSheet,focusOn,toggleLamp};
})();
